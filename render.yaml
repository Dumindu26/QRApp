services:
  # ── Frontend static site ──────────────────────────────────────────────────
  - type: web
    name: qrapp-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      # Every public SPA URL rewrites to index.html. Keep those entry responses
      # uncached so they never reference chunks from a previous deployment.
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /signup
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /takeaway/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /delivery/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Direct index.html requests need the same policy.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Service worker must also be uncached so the browser detects SW updates
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Workbox manifest — same reason as sw.js
      - path: /sw.mjs
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Content-hashed assets: safe to cache forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Static files in public/ — serve directly, don't rewrite to index.html
      - type: rewrite
        source: /*.png
        destination: /*.png
      - type: rewrite
        source: /*.svg
        destination: /*.svg
      - type: rewrite
        source: /*.ico
        destination: /*.ico
      - type: rewrite
        source: /*.webmanifest
        destination: /*.webmanifest
      - type: rewrite
        source: /*.txt
        destination: /*.txt
      - type: rewrite
        source: /*.xml
        destination: /*.xml
      # SPA fallback — all non-asset routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
